server:
  tomcat:
    threads:
      max: 400
      min-spare: 50
    accept-count: 1000
    max-connections: 10000
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/ad_platform?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
    hikari:
      pool-name: AdPlatformHikariPool
      minimum-idle: 20
      maximum-pool-size: 20
      connection-timeout: 3000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 3000ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: 1
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: tracking-consumer
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: com.example.adplatform.*
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.example.adplatform.tracking.message.EventMessage
    listener:
      concurrency: 3

app:
  health:
    mysql-timeout-ms: 2000
    redis-timeout-ms: 2000
  stats:
    flush-delay-ms: 10000
    flush-initial-delay-ms: 10000
  kafka:
    topics:
      event: event-topic
