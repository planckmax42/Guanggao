spring:
  application:
    name: ad-platform
  profiles:
    active: local

server:
  port: 8080

logging:
  file:
    # ERROR 日志落到独立滚动文件，再由 Alloy 异步采集到 Loki。
    path: ${LOG_PATH:logs}
  level:
    root: warn
    com.example.adplatform: warn
    com.zaxxer.hikari: warn

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
