spring:
  application:
    name: ad-platform
  profiles:
    active: local

server:
  port: 8080

logging:
  level:
    root: info
    com.example.adplatform: debug

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
