services:
  debezium-connect:
    image: quay.io/debezium/connect:3.6.0.Final
    container_name: ad-platform-debezium-connect
    # 本项目的 MySQL 运行在 Linux 宿主机 127.0.0.1:3306；host 网络让 Connector
    # 无需放宽 MySQL bind-address，同时也能访问 Kafka 对外公布的 127.0.0.1:9092。
    network_mode: host
    environment:
      BOOTSTRAP_SERVERS: 127.0.0.1:9092
      GROUP_ID: ad-platform-connect
      CONFIG_STORAGE_TOPIC: ad-platform-connect-configs
      OFFSET_STORAGE_TOPIC: ad-platform-connect-offsets
      STATUS_STORAGE_TOPIC: ad-platform-connect-status
      REST_HOST_NAME: 127.0.0.1
      ADVERTISED_HOST_NAME: 127.0.0.1
      ADVERTISED_PORT: 8083
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_FLUSH_INTERVAL_MS: 1000
      KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_PRODUCER_ACKS: all
      CONNECT_PRODUCER_ENABLE_IDEMPOTENCE: "true"
      # 本地环境只输出到 stdout，由 Docker 统一轮转，避免 /kafka/logs 重复落盘。
      CONNECT_LOG4J_LOGGERS: "INFO, stdout"
      KAFKA_WAIT_HOST: 127.0.0.1
      KAFKA_WAIT_PORT: 9092
      KAFKA_WAIT_INTERVAL_SECONDS: 2
    volumes:
      - ./docker/debezium/wait-for-kafka.sh:/opt/debezium/wait-for-kafka.sh:ro
    entrypoint: ["/bin/bash", "/opt/debezium/wait-for-kafka.sh"]
    command: ["start"]
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c 'exec 3<>/dev/tcp/127.0.0.1/8083' || exit 1"]
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    restart: unless-stopped

  debezium-init:
    image: curlimages/curl:8.10.1
    container_name: ad-platform-debezium-init
    network_mode: host
    depends_on:
      debezium-connect:
        condition: service_healthy
    volumes:
      - ./docker/debezium/outbox-connector.json:/config/outbox-connector.json:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        curl --fail --silent --show-error \
          --retry 30 --retry-all-errors --retry-connrefused --retry-delay 2 \
          http://127.0.0.1:8083/connector-plugins >/dev/null
        curl --fail --silent --show-error \
          -X PUT -H 'Content-Type: application/json' \
          --data-binary @/config/outbox-connector.json \
          http://127.0.0.1:8083/connectors/ad-platform-outbox/config
    restart: "no"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: ad-platform-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - ad-platform-es-data:/usr/share/elasticsearch/data
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  ad-platform-es-data:
