apiVersion: 1

datasources:
  - name: Loki
    uid: ad-platform-loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: false

  - name: Prometheus
    uid: ad-platform-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: false
    editable: false
    jsonData:
      timeInterval: 5s
