global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: ad-platform
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8080

  - job_name: kafka-exporter
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:9308
