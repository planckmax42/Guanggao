# 本地六节点 KRaft 集群：3 个独立 controller + 3 个独立 broker。
# 参考：https://github.com/apache/kafka/blob/4.3.1/docker/examples/docker-compose-files/cluster/isolated/plaintext/docker-compose.yml
# 启动：docker compose -f docker-kafka.yml up -d
# 启动前停止占用 9092 的本机 Kafka；镜像会自动初始化各自的数据卷。
# 本机应用：127.0.0.1:9092,127.0.0.1:9094,127.0.0.1:9096
# 同一 Compose 网络内：kafka-1:29092,kafka-2:29092,kafka-3:29092
# Controller 仅在 Compose 网络内监听 9093，不向宿主机发布端口。
# 此拓扑使用六个新的独立数据卷，不会自动迁移原混合节点的数据。
# 原 ad-platform-kafka-{1,2,3}-data 数据卷应保留，不要使用 down -v 删除数据。
# 默认副本数为 3；应用 KafkaTopicConfig 显式指定 replicas(1) 的 Topic 仍为单副本。
name: Kafka

services:
  controller-1:
    image: apache/kafka:4.3.1
    container_name: KafkaController1
    hostname: controller-1
    environment:
      # 六个节点必须使用相同的集群 ID；已有数据卷时不要更换。
      CLUSTER_ID: Jgdi6H7AS1SRud_NMNIm3A
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: controller
      # 创建 Topic 时采用的集群默认值由 Controller 管理。
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "3"
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
      KAFKA_LISTENERS: CONTROLLER://:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT
      # Controller 通过 INTERNAL 连接 Broker，但自身不监听 INTERNAL 端口。
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      - ad-platform-kafka-controller-1-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-metadata-quorum.sh", "--bootstrap-controller", "localhost:9093", "describe", "--status"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 40s
    stop_grace_period: 120s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  controller-2:
    image: apache/kafka:4.3.1
    container_name: KafkaController2
    hostname: controller-2
    environment:
      CLUSTER_ID: Jgdi6H7AS1SRud_NMNIm3A
      KAFKA_NODE_ID: "2"
      KAFKA_PROCESS_ROLES: controller
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "3"
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
      KAFKA_LISTENERS: CONTROLLER://:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      - ad-platform-kafka-controller-2-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-metadata-quorum.sh", "--bootstrap-controller", "localhost:9093", "describe", "--status"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 40s
    stop_grace_period: 120s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  controller-3:
    image: apache/kafka:4.3.1
    container_name: KafkaController3
    hostname: controller-3
    environment:
      CLUSTER_ID: Jgdi6H7AS1SRud_NMNIm3A
      KAFKA_NODE_ID: "3"
      KAFKA_PROCESS_ROLES: controller
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "3"
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
      KAFKA_LISTENERS: CONTROLLER://:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      - ad-platform-kafka-controller-3-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-metadata-quorum.sh", "--bootstrap-controller", "localhost:9093", "describe", "--status"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 40s
    stop_grace_period: 120s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  kafka-1:
    image: apache/kafka:4.3.1
    container_name: Kafka1
    hostname: kafka-1
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      CLUSTER_ID: Jgdi6H7AS1SRud_NMNIm3A
      # Broker 和 Controller 的 node.id 在整个集群中不能重复。
      KAFKA_NODE_ID: "4"
      KAFKA_PROCESS_ROLES: broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
      # Broker 只监听内部通信和本机客户端端口，不监听 Controller 端口。
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:29092,EXTERNAL://127.0.0.1:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER1:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: "3"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: "2"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    volumes:
      - ad-platform-kafka-broker-1-data:/var/lib/kafka/data
    depends_on:
      - controller-1
      - controller-2
      - controller-3
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:29092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 40s
    stop_grace_period: 120s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  kafka-2:
    image: apache/kafka:4.3.1
    container_name: Kafka2
    hostname: kafka-2
    ports:
      - "127.0.0.1:9094:9092"
    environment:
      CLUSTER_ID: Jgdi6H7AS1SRud_NMNIm3A
      KAFKA_NODE_ID: "5"
      KAFKA_PROCESS_ROLES: broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:29092,EXTERNAL://127.0.0.1:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: "3"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: "2"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    volumes:
      - ad-platform-kafka-broker-2-data:/var/lib/kafka/data
    depends_on:
      - controller-1
      - controller-2
      - controller-3
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:29092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 40s
    stop_grace_period: 120s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  kafka-3:
    image: apache/kafka:4.3.1
    container_name: Kafka3
    hostname: kafka-3
    ports:
      - "127.0.0.1:9096:9092"
    environment:
      CLUSTER_ID: Jgdi6H7AS1SRud_NMNIm3A
      KAFKA_NODE_ID: "6"
      KAFKA_PROCESS_ROLES: broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:29092,EXTERNAL://127.0.0.1:9096
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: "3"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: "2"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    volumes:
      - ad-platform-kafka-broker-3-data:/var/lib/kafka/data
    depends_on:
      - controller-1
      - controller-2
      - controller-3
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:29092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 40s
    stop_grace_period: 120s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  ad-platform-kafka-controller-1-data:
  ad-platform-kafka-controller-2-data:
  ad-platform-kafka-controller-3-data:
  ad-platform-kafka-broker-1-data:
  ad-platform-kafka-broker-2-data:
  ad-platform-kafka-broker-3-data:
