<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1180" viewBox="0 0 1680 1180">
  <defs>
    <style>
      .bg { fill: #f7f8fb; }
      .title { font: 700 28px Arial, sans-serif; fill: #172033; }
      .subtitle { font: 14px Arial, sans-serif; fill: #5f6b7a; }
      .table { fill: #ffffff; stroke: #a8b3c7; stroke-width: 1.5; rx: 8; }
      .head-admin { fill: #1f6feb; }
      .head-delivery { fill: #0f766e; }
      .head-report { fill: #9a3412; }
      .head-meta { fill: #4b5563; }
      .head-text { font: 700 16px Arial, sans-serif; fill: #ffffff; }
      .row-text { font: 13px Arial, sans-serif; fill: #1f2937; }
      .key { font: 700 12px Arial, sans-serif; fill: #475569; }
      .muted { font: 12px Arial, sans-serif; fill: #64748b; }
      .line { stroke: #334155; stroke-width: 2; fill: none; }
      .line-soft { stroke: #64748b; stroke-width: 1.8; fill: none; stroke-dasharray: 6 5; }
      .label { font: 12px Arial, sans-serif; fill: #334155; }
      .legend-box { fill: #ffffff; stroke: #cbd5e1; rx: 6; }
      .badge { fill: #eef2ff; stroke: #c7d2fe; rx: 4; }
    </style>
    <marker id="many" markerWidth="20" markerHeight="18" refX="18" refY="9" orient="auto" markerUnits="strokeWidth">
      <path d="M 18 9 L 2 2 M 18 9 L 2 9 M 18 9 L 2 16" stroke="#334155" stroke-width="1.8" fill="none"/>
    </marker>
    <marker id="one" markerWidth="14" markerHeight="16" refX="13" refY="8" orient="auto" markerUnits="strokeWidth">
      <path d="M 4 2 L 4 14 M 10 2 L 10 14" stroke="#334155" stroke-width="1.8" fill="none"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1680" height="1180"/>
  <text class="title" x="60" y="48">ad_platform ER Diagram</text>
  <text class="subtitle" x="60" y="72">Generated from current local MySQL schema. Relationships are inferred; the database has no physical foreign-key constraints.</text>

  <!-- advertiser -->
  <g id="advertiser" transform="translate(60,110)">
    <rect class="table" x="0" y="0" width="300" height="286"/>
    <rect class="head-admin" x="0" y="0" width="300" height="38" rx="8"/>
    <text class="head-text" x="16" y="25">advertiser</text>
    <text class="row-text" x="16" y="62">id <tspan class="key">PK</tspan></text>
    <text class="row-text" x="16" y="88">name <tspan class="key">UK</tspan></text>
    <text class="row-text" x="16" y="114">industry</text>
    <text class="row-text" x="16" y="140">contact_name</text>
    <text class="row-text" x="16" y="166">contact_email</text>
    <text class="row-text" x="16" y="192">status</text>
    <text class="row-text" x="16" y="218">created_at</text>
    <text class="row-text" x="16" y="244">updated_at</text>
    <text class="muted" x="16" y="270">1 advertiser owns N campaigns</text>
  </g>

  <!-- ad_campaign -->
  <g id="ad_campaign" transform="translate(460,86)">
    <rect class="table" x="0" y="0" width="330" height="364"/>
    <rect class="head-admin" x="0" y="0" width="330" height="38" rx="8"/>
    <text class="head-text" x="16" y="25">ad_campaign</text>
    <text class="row-text" x="16" y="62">id <tspan class="key">PK</tspan></text>
    <text class="row-text" x="16" y="88">advertiser_id <tspan class="key">FK inferred</tspan></text>
    <text class="row-text" x="16" y="114">name</text>
    <text class="row-text" x="16" y="140">budget_total</text>
    <text class="row-text" x="16" y="166">budget_daily</text>
    <text class="row-text" x="16" y="192">bid_price</text>
    <text class="row-text" x="16" y="218">billing_type</text>
    <text class="row-text" x="16" y="244">start_time</text>
    <text class="row-text" x="16" y="270">end_time</text>
    <text class="row-text" x="16" y="296">status</text>
    <text class="row-text" x="16" y="322">created_at</text>
    <text class="row-text" x="16" y="348">updated_at</text>
  </g>

  <!-- ad_creative -->
  <g id="ad_creative" transform="translate(900,86)">
    <rect class="table" x="0" y="0" width="330" height="364"/>
    <rect class="head-delivery" x="0" y="0" width="330" height="38" rx="8"/>
    <text class="head-text" x="16" y="25">ad_creative</text>
    <text class="row-text" x="16" y="62">id <tspan class="key">PK</tspan></text>
    <text class="row-text" x="16" y="88">campaign_id <tspan class="key">FK inferred</tspan></text>
    <text class="row-text" x="16" y="114">ad_slot_id <tspan class="key">FK inferred, nullable</tspan></text>
    <text class="row-text" x="16" y="140">title</text>
    <text class="row-text" x="16" y="166">description</text>
    <text class="row-text" x="16" y="192">image_url</text>
    <text class="row-text" x="16" y="218">landing_page_url</text>
    <text class="row-text" x="16" y="244">audit_status</text>
    <text class="row-text" x="16" y="270">status</text>
    <text class="row-text" x="16" y="296">created_at</text>
    <text class="row-text" x="16" y="322">updated_at</text>
  </g>

  <!-- ad_slot -->
  <g id="ad_slot" transform="translate(1320,110)">
    <rect class="table" x="0" y="0" width="300" height="286"/>
    <rect class="head-delivery" x="0" y="0" width="300" height="38" rx="8"/>
    <text class="head-text" x="16" y="25">ad_slot</text>
    <text class="row-text" x="16" y="62">id <tspan class="key">PK</tspan></text>
    <text class="row-text" x="16" y="88">slot_code <tspan class="key">UK</tspan></text>
    <text class="row-text" x="16" y="114">name</text>
    <text class="row-text" x="16" y="140">width</text>
    <text class="row-text" x="16" y="166">height</text>
    <text class="row-text" x="16" y="192">scene</text>
    <text class="row-text" x="16" y="218">status</text>
    <text class="row-text" x="16" y="244">created_at</text>
    <text class="row-text" x="16" y="270">updated_at</text>
  </g>

  <!-- ad_targeting_rule -->
  <g id="ad_targeting_rule" transform="translate(460,560)">
    <rect class="table" x="0" y="0" width="330" height="312"/>
    <rect class="head-admin" x="0" y="0" width="330" height="38" rx="8"/>
    <text class="head-text" x="16" y="25">ad_targeting_rule</text>
    <text class="row-text" x="16" y="62">id <tspan class="key">PK</tspan></text>
    <text class="row-text" x="16" y="88">campaign_id <tspan class="key">FK inferred, UK</tspan></text>
    <text class="row-text" x="16" y="114">region nullable</text>
    <text class="row-text" x="16" y="140">device_type nullable</text>
    <text class="row-text" x="16" y="166">gender nullable</text>
    <text class="row-text" x="16" y="192">age_min nullable</text>
    <text class="row-text" x="16" y="218">age_max nullable</text>
    <text class="row-text" x="16" y="244">user_tags nullable</text>
    <text class="row-text" x="16" y="270">created_at</text>
    <text class="row-text" x="16" y="296">updated_at</text>
  </g>

  <!-- ad_event -->
  <g id="ad_event" transform="translate(900,560)">
    <rect class="table" x="0" y="0" width="330" height="338"/>
    <rect class="head-report" x="0" y="0" width="330" height="38" rx="8"/>
    <text class="head-text" x="16" y="25">ad_event</text>
    <text class="row-text" x="16" y="62">id <tspan class="key">PK</tspan></text>
    <text class="row-text" x="16" y="88">event_id <tspan class="key">UK</tspan></text>
    <text class="row-text" x="16" y="114">request_id nullable</text>
    <text class="row-text" x="16" y="140">event_type</text>
    <text class="row-text" x="16" y="166">campaign_id <tspan class="key">FK inferred</tspan></text>
    <text class="row-text" x="16" y="192">creative_id <tspan class="key">FK inferred</tspan></text>
    <text class="row-text" x="16" y="218">ad_slot_id <tspan class="key">FK inferred</tspan></text>
    <text class="row-text" x="16" y="244">user_id external/no users table</text>
    <text class="row-text" x="16" y="270">billing_type</text>
    <text class="row-text" x="16" y="296">event_time</text>
    <text class="row-text" x="16" y="322">created_at</text>
  </g>

  <!-- ad_stats_daily -->
  <g id="ad_stats_daily" transform="translate(1320,560)">
    <rect class="table" x="0" y="0" width="300" height="338"/>
    <rect class="head-report" x="0" y="0" width="300" height="38" rx="8"/>
    <text class="head-text" x="16" y="25">ad_stats_daily</text>
    <text class="row-text" x="16" y="62">id <tspan class="key">PK</tspan></text>
    <text class="row-text" x="16" y="88">stat_date <tspan class="key">UK part</tspan></text>
    <text class="row-text" x="16" y="114">campaign_id <tspan class="key">FK inferred, UK part</tspan></text>
    <text class="row-text" x="16" y="140">creative_id <tspan class="key">FK inferred, UK part</tspan></text>
    <text class="row-text" x="16" y="166">ad_slot_id <tspan class="key">FK inferred</tspan></text>
    <text class="row-text" x="16" y="192">impression_count</text>
    <text class="row-text" x="16" y="218">click_count</text>
    <text class="row-text" x="16" y="244">conversion_count</text>
    <text class="row-text" x="16" y="270">cost_amount</text>
    <text class="row-text" x="16" y="296">created_at</text>
    <text class="row-text" x="16" y="322">updated_at</text>
  </g>

  <!-- schema_version -->
  <g id="schema_version" transform="translate(60,740)">
    <rect class="table" x="0" y="0" width="300" height="166"/>
    <rect class="head-meta" x="0" y="0" width="300" height="38" rx="8"/>
    <text class="head-text" x="16" y="25">schema_version</text>
    <text class="row-text" x="16" y="62">id <tspan class="key">PK</tspan></text>
    <text class="row-text" x="16" y="88">version <tspan class="key">UK</tspan></text>
    <text class="row-text" x="16" y="114">description</text>
    <text class="row-text" x="16" y="140">installed_at</text>
  </g>

  <!-- relationship lines -->
  <path class="line" d="M 360 250 C 400 250, 420 250, 460 250" marker-start="url(#one)" marker-end="url(#many)"/>
  <text class="label" x="386" y="238">owns</text>

  <path class="line" d="M 790 250 C 830 250, 860 250, 900 250" marker-start="url(#one)" marker-end="url(#many)"/>
  <text class="label" x="825" y="238">has creatives</text>

  <path class="line" d="M 625 450 L 625 560" marker-start="url(#one)" marker-end="url(#one)"/>
  <text class="label" x="638" y="512">0..1 targeting</text>

  <path class="line" d="M 1230 250 C 1265 250, 1285 250, 1320 250" marker-start="url(#many)" marker-end="url(#one)"/>
  <text class="label" x="1248" y="238">served in</text>

  <path class="line-soft" d="M 790 350 C 840 470, 850 650, 900 720" marker-start="url(#one)" marker-end="url(#many)"/>
  <text class="label" x="792" y="524">campaign events</text>

  <path class="line" d="M 1065 450 L 1065 560" marker-start="url(#one)" marker-end="url(#many)"/>
  <text class="label" x="1078" y="512">creative events</text>

  <path class="line-soft" d="M 1470 396 C 1470 500, 1245 590, 1230 728" marker-start="url(#one)" marker-end="url(#many)"/>
  <text class="label" x="1304" y="548">slot events</text>

  <path class="line-soft" d="M 790 404 C 920 1010, 1220 1010, 1320 742" marker-start="url(#one)" marker-end="url(#many)"/>
  <text class="label" x="965" y="1020">campaign daily aggregates</text>

  <path class="line-soft" d="M 1230 414 C 1300 475, 1320 535, 1320 722" marker-start="url(#one)" marker-end="url(#many)"/>
  <text class="label" x="1252" y="490">creative daily aggregates</text>

  <path class="line-soft" d="M 1470 396 L 1470 560" marker-start="url(#one)" marker-end="url(#many)"/>
  <text class="label" x="1483" y="490">slot daily aggregates</text>

  <!-- legend -->
  <g transform="translate(60,980)">
    <rect class="legend-box" x="0" y="0" width="560" height="120"/>
    <text class="head-text" x="18" y="30" fill="#172033">Legend</text>
    <rect class="badge" x="18" y="48" width="66" height="24"/>
    <text class="muted" x="31" y="65">PK/UK</text>
    <text class="subtitle" x="100" y="65">Primary and unique keys from information_schema.</text>
    <line class="line" x1="22" y1="88" x2="84" y2="88" marker-end="url(#many)"/>
    <text class="subtitle" x="100" y="92">Solid lines: core admin/delivery references.</text>
    <line class="line-soft" x1="300" y1="88" x2="362" y2="88" marker-end="url(#many)"/>
    <text class="subtitle" x="378" y="92">Dashed lines: tracking/report aggregates.</text>
  </g>
</svg>
